services:
  # ORBIT FastAPI Backend Service (Free Tier)
  - type: web
    name: orbit-api
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r services/api/requirements.txt"
    startCommand: "uvicorn services.api.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
