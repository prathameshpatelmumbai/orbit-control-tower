version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL with pgvector extension
  # ----------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orbit-postgres
    restart: always
    environment:
      POSTGRES_USER: orbit_admin
      POSTGRES_PASSWORD: orbit_secret_password
      POSTGRES_DB: orbit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit_admin -d orbit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. Redis Event Bus & Streams
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 3. MLflow Tracking Server
  # ----------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: orbit-mlflow
    restart: always
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=sqlite:///mlflow.db
      - DEFAULT_ARTIFACT_ROOT=/mlflow-artifacts
    volumes:
      - mlflow_data:/mlflow-artifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow-artifacts
      --host 0.0.0.0
      --port 5000

  # ----------------------------------------------------
  # 4. ORBIT FastAPI Backend Service
  # ----------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: orbit-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - duckdb_storage:/workspace/storage
    environment:
      - DATABASE_URL=postgresql+asyncpg://orbit_admin:orbit_secret_password@postgres:5432/orbit_db
      - REDIS_URL=redis://redis:6379/0
      - DUCKDB_PATH=/workspace/storage/orbit_analytics.duckdb
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------
  # 5. ORBIT Next.js 15 Web Frontend
  # ----------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    container_name: orbit-web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/events

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  duckdb_storage:
    driver: local
  mlflow_data:
    driver: local
